name: Unknown edition
description: "The launcher listed one of your games as an unknown build."
title: "Unknown edition: "
labels: ["edition"]
body:
  - type: markdown
    attributes:
      value: |
        The launcher only starts builds it has identified by SHA-256, so it listed yours as
        unknown and left it untouched. Tell us about your copy: a build we can verify gets
        added. Never attach or link game files.
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options:
        - OutRun 2 SP SDX
        - OutRun 2 SP Special Tours
        - Crazy Taxi High Roller
        - SEGA Rally 3
        - SEGA Racing Classic
        - Daytona Championship USA
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256
      description: >-
        The SHA-256 that `sega-launcher --list` (or the window) showed: 64 characters, digits 0-9
        and letters a-f.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: The file it named, and its size in bytes
      description: e.g. "Rally/Rally.exe, 9437184".
  - type: input
    id: details
    attributes:
      label: Version and region
      description: e.g. "1.01.00, Export". Where the folder name or the game's test menu says it.
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of `sega-launcher --help`, or the release you downloaded.
