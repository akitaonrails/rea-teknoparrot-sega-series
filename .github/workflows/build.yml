name: build

# Checks every push (the SDK's launcher-ci: fmt, tests, clippy, deny, the
# family rules, the Windows-target tests under Wine), builds both packages
# (Linux and Windows, every component bundled) and, on a vX.Y.Z tag, publishes them
# (the SDK's launcher-release).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.11.2
    with:
      concurrency-key: linux
      rust-target: ""
      apt-packages: libsdl2-dev
      shell-syntax: scripts/*.sh sdk/packaging/*.sh sdk/rea-play.sh
      shell-tests: ""
      imports-check: false

  # The Windows build: linted for its target and its tests run under Wine,
  # headless (STANDARDS: Windows code is run, not only linted), with the
  # pinned SDL2 MinGW package linked in (launcher-ci's extra build comes
  # after its release build, too late for SDL2's import library). GE-Proton's
  # Wine (the Linux package's runner): Ubuntu's Wine 9 doesn't follow the
  # directory junctions the Windows runtime folder uses.
  windows-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 lld curl
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: SDL2 (pinned MinGW package)
        run: |
          sdk/packaging/build-launcher.sh sdl2
          echo "SDL2_LIB=$(ls -d "$PWD"/dist/sdl2/SDL2-*/x86_64-w64-mingw32)/lib" >> "$GITHUB_ENV"
      - name: Clippy (x86_64-pc-windows-gnu)
        run: |
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $SDL2_LIB"
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - name: Wine (GE-Proton, pinned)
        run: |
          scripts/build-components.sh "$RUNNER_TEMP/c" runner
          echo "$RUNNER_TEMP/c/runner/bin" >> "$GITHUB_PATH"
      - name: Tests under Wine
        run: |
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $SDL2_LIB"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER=wine
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEDEBUG=-all
          export WINEPATH="Z:$(printf '%s' "$PWD/dist/sdl2" | tr / '\\')"
          wine --version
          cargo test --workspace --locked --target x86_64-pc-windows-gnu

  # lindbergh-loader (OutRun 2 SP SDX, Linux package) in its ubuntu:22.04
  # build container, which needs the runner's docker; tarred so its library
  # symlinks survive the artifact.
  lindbergh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          scripts/build-components.sh dist/components lindbergh
          tar -C dist/components -czf lindbergh.tar.gz lindbergh
      - uses: actions/upload-artifact@v4
        with:
          name: lindbergh
          path: lindbergh.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Both packages from one build of windowsarcadeloader (its Linux and
  # Windows launchers, the Windows payloads), on Debian bookworm (glibc
  # 2.36) so the Linux programs run on older distributions too. The Windows
  # programs link with LLD (.cargo/config.toml).
  packages:
    needs: lindbergh
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 120
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config cmake git curl \
            ca-certificates xz-utils zip unzip lld libsdl2-dev gcc-mingw-w64 mono-mcs mono-devel \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl-dev libegl-dev libgles-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev libsndio-dev \
            libusb-1.0-0-dev
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lindbergh
      - name: lindbergh-loader (from its job)
        run: |
          mkdir -p dist/components
          tar -C dist/components -xzf lindbergh.tar.gz
          rm lindbergh.tar.gz
          test -f dist/components/lindbergh/lindbergh.so
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add i686-pc-windows-gnu x86_64-pc-windows-gnu
      - name: Launcher
        run: |
          # libSDL2 ships in lib/ beside the program, found through its RUNPATH
          RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/lib' cargo build --release --locked -p sega-launcher
          mkdir -p dist/linux/lib
          cp target/release/sega-launcher dist/linux/
          cp -L "$(ldconfig -p | awk '$1 == "libSDL2-2.0.so.0" && /x86-64/ { print $NF; exit }')" dist/linux/lib/
          cp /usr/share/doc/libsdl2-2.0-0/copyright dist/linux/SDL2-copyright.txt
      - name: Linux package
        env:
          # windowsarcadeloader's launcher with SDL3 inside it
          LAUNCHER_FEATURES: sdl3/build-from-source-static
        run: |
          git config --global --add safe.directory '*'
          scripts/package.sh linux
      - name: Windows package
        run: |
          sdk/packaging/build-launcher.sh windows sega-launcher
          scripts/package.sh windows
      - name: Contents
        run: |
          cd dist/pkg
          ls -l *.tar.gz *.zip
          unzip -l SegaRacingLauncher-*-windows-x86_64.zip | grep -v -e "/systemprofiles/" -e "/payloads/"
          tar -tzf SegaRacingLauncher-*-linux-x86_64.tar.gz | grep -v "/components/runner/" | sort
          tar -tzf SegaRacingLauncher-*-linux-x86_64.tar.gz | grep -q "components/lindbergh/lindbergh.so"
          tar -tzf SegaRacingLauncher-*-linux-x86_64.tar.gz | grep -q "components/directx/directx9/directx_Jun2010_redist.exe"
          tar -tzf SegaRacingLauncher-*-linux-x86_64.tar.gz | grep -q "components/flycast/usr/bin/flycast"
          tar -tzf SegaRacingLauncher-*-linux-x86_64.tar.gz | grep -q "components/xemu/usr/bin/xemu"
          unzip -l SegaRacingLauncher-*-windows-x86_64.zip | grep -q "components/flycast/flycast.exe"
          unzip -l SegaRacingLauncher-*-windows-x86_64.zip | grep -q "components/xemu/xemu.exe"
          # every file is on the package's allowlist (no game file, no stray build output)
          sh ../../sdk/packaging/smoke-package.sh SegaRacingLauncher-*-linux-x86_64/ ../../packaging/allowlist-linux.txt
          sh ../../sdk/packaging/smoke-package.sh SegaRacingLauncher-*-windows-x86_64.zip ../../packaging/allowlist-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SegaRacingLauncher-packages
          path: |
            dist/pkg/SegaRacingLauncher-*-linux-x86_64.tar.gz
            dist/pkg/SegaRacingLauncher-*-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, windows-tests, packages]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.11.2
    with:
      package: sega-launcher
      artifact-pattern: SegaRacingLauncher-*
